<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rapport officiel</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700;800&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      color: #fff;
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 40px 24px;
      max-width: 720px;
      width: 100%;
    }

    .badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #a3a3a3;
      border: 1px solid #333;
      border-radius: 999px;
      padding: 6px 18px;
      margin-bottom: 48px;
      opacity: 0;
      animation: fadeIn 0.5s ease 0.3s forwards;
    }

    /* Titre */
    .title {
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 48px;
    }

    .title .line {
      display: block;
      overflow: hidden;
    }

    .title .line span {
      display: inline-block;
      transform: translateY(110%);
      animation: slideUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Lignes 1 & 2 — petites */
    .title .line:nth-child(1) { font-size: clamp(1.3rem, 4vw, 2.4rem); }
    .title .line:nth-child(2) { font-size: clamp(1.3rem, 4vw, 2.4rem); }

    .title .line:nth-child(1) span { animation-delay: 0.5s; }
    .title .line:nth-child(2) span { animation-delay: 0.7s; }

    /* Ligne 3 — plus grosse + couleur */
    .title .line:nth-child(3) { font-size: clamp(1.8rem, 6vw, 4rem); margin-top: 12px; }
    .title .line:nth-child(3) span {
      background: linear-gradient(90deg, #ff6b6b, #ffd93d, #ff6b6b);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: slideUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.9s forwards,
                 shine 3s linear 1.6s infinite;
    }

    @keyframes slideUp {
      to { transform: translateY(0); }
    }
    @keyframes shine {
      to { background-position: 200% center; }
    }

    /* Échelle pain */
    .pain-block {
      opacity: 0;
      animation: fadeIn 0.6s ease 1.4s forwards;
    }

    .pain-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #555;
      margin-bottom: 12px;
    }
    .pain-label .pain-title { color: #fff; font-size: 0.8rem; }

    .pain-scale {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .pain-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      opacity: 0;
      transform: translateY(10px);
      animation: popIn 0.4s ease forwards;
    }
    .pain-item:nth-child(1) { animation-delay: 1.6s; }
    .pain-item:nth-child(2) { animation-delay: 1.8s; }
    .pain-item:nth-child(3) { animation-delay: 2.0s; }
    .pain-item:nth-child(4) { animation-delay: 2.2s; }
    .pain-item:nth-child(5) { animation-delay: 2.4s; }

    @keyframes popIn {
      to { opacity: 1; transform: translateY(0); }
    }

    .pain-emoji {
      font-size: 1.6rem;
      filter: grayscale(1);
      transition: filter 0.3s;
    }
    .pain-item.active .pain-emoji {
      filter: grayscale(0);
      animation: bounce 0.6s ease 2.6s both;
    }
    @keyframes bounce {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.4); }
      70%  { transform: scale(0.9); }
      100% { transform: scale(1.1); }
    }

    .pain-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #222;
      border: 2px solid #333;
    }
    .pain-item.active .pain-dot {
      background: #ffd93d;
      border-color: #ffd93d;
      box-shadow: 0 0 8px #ffd93d;
    }

    .pain-sublabel {
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #333;
    }
    .pain-item.active .pain-sublabel {
      color: #ffd93d;
    }

    /* Certifié */
    .certified {
      margin-top: 40px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #333;
      opacity: 0;
      animation: fadeIn 0.5s ease 3s forwards;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="badge">⚡ Rapport du jour — confidentiel</div>

    <h1 class="title">
      <span class="line"><span>Journée de merde ?</span></span>
      <span class="line"><span>Peut-être.</span></span>
      <span class="line"><span>Mais n'oublie pas que tu restes la plus douce princesse de cette planète.</span></span>
    </h1>

    <div class="pain-block">
      <div class="pain-label">
        <span>Échelle du pain</span>
        <span class="pain-title">🥖 Pain au céréales</span>
      </div>
      <div class="pain-scale">
        <div class="pain-item">
          <div class="pain-emoji">🍞</div>
          <div class="pain-dot"></div>
          <div class="pain-sublabel">Pain blanc</div>
        </div>
        <div class="pain-item">
          <div class="pain-emoji">🥐</div>
          <div class="pain-dot"></div>
          <div class="pain-sublabel">Croissant</div>
        </div>
        <div class="pain-item">
          <div class="pain-emoji">🥖</div>
          <div class="pain-dot"></div>
          <div class="pain-sublabel">Baguette</div>
        </div>
        <div class="pain-item">
          <div class="pain-emoji">🫓</div>
          <div class="pain-dot"></div>
          <div class="pain-sublabel">Pain complet</div>
        </div>
        <div class="pain-item active">
          <div class="pain-emoji">🌾</div>
          <div class="pain-dot"></div>
          <div class="pain-sublabel">Aux céréales</div>
        </div>
      </div>
    </div>

    <p class="certified">✓ 100 % certifié — mis à jour en temps réel</p>

  </div>
</body>
</html>
